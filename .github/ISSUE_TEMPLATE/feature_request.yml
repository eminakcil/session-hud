name: ✨ Feature request
description: An idea for session-hud
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: What you want to know or do, and why.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it look?
      description: Where it would go (band, pane, tooltip) and what it would show. A sketch or screenshot is welcome.
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this
