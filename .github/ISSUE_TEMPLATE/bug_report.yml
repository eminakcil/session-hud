name: 🐛 Bug report
description: Something in session-hud does not work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a session in ...
        2. Hover ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshots
      description: A screenshot of the band or the pane helps a lot.
  - type: dropdown
    id: surface
    attributes:
      label: Where
      multiple: true
      options:
        - Desktop app
        - Terminal
        - VS Code
        - Mobile
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
      placeholder: 2.1.322 (Claude Code)
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: The `version` in .claude-plugin/plugin.json, or what `/plugin` lists
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
